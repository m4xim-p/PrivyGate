name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Не запускать два деплоя одновременно; новый пуш отменяет предыдущий прогон на той же ветке.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) Тесты на каждый push и PR
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Run tests
        run: pytest

  # 2) Деплой на сервер: только после зелёных тестов и только из main
  deploy:
    name: Deploy to server
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync files to server
        run: |
          set -euo pipefail
          rsync -rlptz --delete --no-owner --no-group \
            --exclude '.git' --exclude '.venv' --exclude '.env' \
            --exclude '__pycache__' --exclude '.pytest_cache' \
            -e "ssh -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Build, restart and health check
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'EOS'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          docker compose up -d --build --remove-orphans
          docker image prune -f
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              echo "gateway healthy"
              exit 0
            fi
            sleep 2
          done
          echo "::error::health check failed"
          docker compose logs --tail=80
          exit 1
          EOS
