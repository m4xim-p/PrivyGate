[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "privygate"
version = "0.1.0"
description = "Educational privacy-preserving streaming LLM proxy"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
ner = [
    "torch>=2.4,<3",
    "transformers>=4.48,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "mock_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
