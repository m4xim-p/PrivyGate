[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "privygate"
version = "0.1.0"
description = "Educational privacy-preserving streaming LLM proxy"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "bandit==1.9.4",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "psutil>=7.0,<8",
    "pytest==9.1.1",
    "ruff==0.16.8",
    "types-psutil>=7.0,<8",
]
ner = [
    "torch>=2.4,<3",
    "transformers>=4.48,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "mock_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "B",    # bugbear: likely bugs and unsafe constructs
    "C90",  # McCabe complexity
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import ordering
    "SIM",  # simplifications that reduce complexity
    "UP",   # deprecated Python syntax and APIs
    "W",    # pycodestyle warnings
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"scripts/test_ner.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
files = ["app", "mock_llm", "scripts"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["torch", "transformers"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
severity = "medium"
confidence = "medium"
